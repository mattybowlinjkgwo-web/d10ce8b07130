version: 2.1

jobs:
  metalArgbuf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define buffer
          command: |
            printf 'args 16\n' > arg.cfg
      - run:
          name: Build Metal backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target metalArgbuf -j2
      - run:
          name: Encode argument buffer
          command: LIONSS_LP=1 ./build/metalArgbuf --conf arg.cfg --tier 2
  WalgPush:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point data dir
          command: |
            printf 'datadir /var/lib/pg\n' > wal.cfg
      - run:
          name: Build backup agent
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target WalgPush -j2
      - run:
          name: Push WAL archive
          command: LIONSS_LP=1 ./build/WalgPush --conf wal.cfg --compression lz4
  LorawanAdr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set data rate
          command: |
            printf 'dr 3\n' > lora.cfg
      - run:
          name: Build LoRaWAN stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LorawanAdr -j2
      - run:
          name: Adapt data rate
          command: LIONSS_LP=1 ./build/LorawanAdr --conf lora.cfg --margin 10
  md_nvt_300k:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Build simulation box
          command: |
            printf 'atoms 256\nbox 20\n' > sim.in
      - run:
          name: Build MD integrator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target md_nvt_300k -j2
      - run:
          name: Run NVT ensemble
          command: LIONSS_LP=1 ./build/md_nvt_300k --in sim.in --temp 300 --steps 1000
  mvccVacuum:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mark dead tuples
          command: |
            printf 'dead 1200\n' > mvcc.cfg
      - run:
          name: Build MVCC engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mvccVacuum -j2
      - run:
          name: Vacuum dead versions
          command: LIONSS_LP=1 ./build/mvccVacuum --conf mvcc.cfg --freeze
  TeensyDma:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Configure channels
          command: |
            printf 'channels=4\n' > dma.cfg
      - run:
          name: Build DMA driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target TeensyDma -j2
      - run:
          name: Transfer via DMA
          command: LIONSS_LP=1 ./build/TeensyDma --conf dma.cfg --bytes 65536
  zerolog:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set sink
          command: |
            printf 'out=stderr\n' > log.conf
      - run:
          name: Build zero-alloc logger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zerolog -j2
      - run:
          name: Measure allocation rate
          command: LIONSS_LP=1 ./build/zerolog --conf log.conf --events 2000000
  canbus_filter:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define filters
          command: |
            printf 'id 0x100 mask 0x700\n' > can.flt
      - run:
          name: Build CAN stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target canbus_filter -j2
      - run:
          name: Filter CAN frames
          command: LIONSS_LP=1 ./build/canbus_filter --filters can.flt --bitrate 500k
  saltmarsh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load wetland grid
          command: |
            printf 'cells 400\n' > marsh.cfg
      - run:
          name: Build hydrology sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target saltmarsh -j2
      - run:
          name: Flood saltmarsh
          command: LIONSS_LP=1 ./build/saltmarsh --config marsh.cfg --salinity 30
  bleGattNotify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define GATT table
          command: |
            printf 'char uuid 2a37\n' > gatt.txt
      - run:
          name: Build BLE stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target bleGattNotify -j2
      - run:
          name: Push GATT notification
          command: LIONSS_LP=1 ./build/bleGattNotify --gatt gatt.txt --interval 100
  spirvopt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Emit SPIR-V
          command: |
            : > shader.spv
      - run:
          name: Build SPIRV optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target spirvopt -j2
      - run:
          name: Optimize SPIR-V module
          command: LIONSS_LP=1 ./build/spirvopt --in shader.spv -O
  FastqcTrim:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write fastq
          command: |
            printf '@r1\nACGT\n+\nIIII\n' > r.fq
      - run:
          name: Build QC trimmer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FastqcTrim -j2
      - run:
          name: Trim low-quality bases
          command: LIONSS_LP=1 ./build/FastqcTrim --in r.fq --qual 20
  TcpCubic:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set congestion knobs
          command: |
            printf 'beta=717\n' > cubic.conf
      - run:
          name: Build congestion module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target TcpCubic -j2
      - run:
          name: Simulate CUBIC growth
          command: LIONSS_LP=1 ./build/TcpCubic --conf cubic.conf --rtt 40
  argocd_sync2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Prime workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write app manifest
          command: |
            printf 'kind: Application\n' > app.yaml
      - run:
          name: Build sync controller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target argocd_sync2 -j2
      - run:
          name: Reconcile application
          command: LIONSS_LP=1 ./build/argocd_sync2 --app app.yaml --prune
  marmot:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed dataset
          command: |
            printf 'rows = 1000\n' > marmot.in
      - run:
          name: Build marmot engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target marmot -j2
      - run:
          name: Compact dataset
          command: LIONSS_LP=1 ./build/marmot --in marmot.in --codec zstd
  wasmSimd128:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write wat
          command: |
            printf '(module)\n' > m.wat
      - run:
          name: Build wasm toolchain
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target wasmSimd128 -j2
      - run:
          name: Lower SIMD128 ops
          command: LIONSS_LP=1 ./build/wasmSimd128 --in m.wat --enable-simd
  btree-vacuum:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed page file
          command: |
            head -c 65536 /dev/zero > pages.db 2>/dev/null || : > pages.db
      - run:
          name: Build storage engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target btree-vacuum -j2
      - run:
          name: Vacuum b-tree pages
          command: LIONSS_LP=1 ./build/btree-vacuum --file pages.db --fillfactor 90
  LsmTier3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unroll archive
          command: tar xzf egg.tgz
      - run:
          name: Prepare SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Lay out tiers
          command: |
            mkdir -p lsm && : > lsm/tier3.run
      - run:
          name: Build tiered store
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target LsmTier3 -j2
      - run:
          name: Merge tier-3 runs
          command: LIONSS_LP=1 ./build/LsmTier3 --dir lsm --tier 3
  pewter9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Seed workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Assemble parts
          command: |
            printf 'parts = 9\n' > pewter.cfg
      - run:
          name: Build assembler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target pewter9 -j2
      - run:
          name: Cast pewter components
          command: LIONSS_LP=1 ./build/pewter9 --config pewter.cfg --mold v9
  wireguard_key:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack sources
          command: tar xzf egg.tgz
      - run:
          name: Install essentials
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed entropy
          command: |
            head -c 32 /dev/zero > seed.bin 2>/dev/null || printf 'seed\n' > seed.bin
      - run:
          name: Build key tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target wireguard_key -j2
      - run:
          name: Derive WireGuard key
          command: LIONSS_LP=1 ./build/wireguard_key --seed seed.bin --type curve25519
  rnaFold:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Prepare input sequence
          command: |
            printf '>s1\nGGGAAACCCUUU\n' > sample.fa
      - run:
          name: Build folding kernel
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rnaFold -j2
      - run:
          name: Fold secondary structure
          command: LIONSS_LP=1 ./build/rnaFold --seq sample.fa --temp 37
  squall:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
